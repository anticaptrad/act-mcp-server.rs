[package]
name = "act_mcp_server"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Host-bound read-only HTTP MCP compatibility service for the AntiCapTrad platform"
license = "MIT"
repository = "https://github.com/anticaptrad/act-mcp-server.rs"

[dependencies]
tokio = { version = "1.37.0", features = ["full"] }
axum = "0.7.5"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.115"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.33.0"
opentelemetry = "0.32.0"
opentelemetry_sdk = { version = "0.32.0", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic", "metrics", "trace"] }
anyhow = "1.0"
flags2env = { git = "https://github.com/ORESoftware/flags-2-env.git", rev = "377bff1a4e7424eb98377997a232ddc0fc700f59" }
# Constant-time secret comparison for the shared-secret gate.
sha2 = "0.10"
subtle = "2.6"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
lto = "thin"
