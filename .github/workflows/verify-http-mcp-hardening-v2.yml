name: Verify HTTP MCP hardening v2

on:
  push:
    branches:
      - agent/harden-http-mcp-contract
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/verify-http-mcp-hardening-v2.yml'

permissions:
  contents: write

concurrency:
  group: verify-http-mcp-hardening-v2-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  verify-and-format:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/harden-http-mcp-contract
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.97.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Refresh the lockfile for the explicit router-test dependency
        run: cargo check --all-targets
      - name: Format
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets
      - name: Release build
        run: cargo build --locked --release
      - name: Scan for unresolved conflict markers
        run: |
          if git grep -n -E '^(<<<<<<< |=======$|>>>>>>> )' -- . ':(exclude)*.lock'; then
            exit 1
          fi
      - name: Commit verified lockfile and formatting
        shell: bash
        run: |
          set -euo pipefail
          git add -- src Cargo.toml Cargo.lock README.md TESTING.md .env.example
          if git diff --cached --quiet; then
            echo 'No generated changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Verify hardened ACT MCP contract'
          git push origin HEAD:agent/harden-http-mcp-contract
