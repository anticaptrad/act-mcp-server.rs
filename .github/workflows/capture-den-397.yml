name: Capture DEN-397 validation (temporary)

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  capture:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/den-397-flags2env' &&
      github.actor == 'ORESoftware'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.97.0"
          components: clippy
      - name: Capture clippy diagnostic
        shell: bash
        run: |
          set +e
          cargo clippy --locked --all-targets --message-format=short -- -D warnings > .den-397-validation.txt 2>&1
          status=$?
          printf '\nclippy_status=%s\n' "$status" >> .den-397-validation.txt
          exit 0
      - name: Commit diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .den-397-validation.txt
          git commit -m 'chore: capture AntiCapTrad flags validation'
          git push origin HEAD:feat/den-397-flags2env
